services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tripgo
      POSTGRES_USER: tripgo
      POSTGRES_PASSWORD: tripgo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripgo -d tripgo"]
      interval: 5s
      timeout: 3s
      retries: 10

  trip-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://tripgo:tripgo@postgres:5432/tripgo?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
